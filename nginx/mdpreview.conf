# Cloudflare Tunnel terminates HTTPS and forwards to this loopback listener.
map $http_x_forwarded_proto $mdpreview_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 127.0.0.1:8027;
    server_name mdpreview.azmirf.my.id;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mdpreview_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 127.0.0.1:8027;
    server_name itsazmi.com;
    client_max_body_size 6m;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /mynotes {
        return 308 /mynotes/$is_args$args;
    }

    location /mynotes/ {
        # Preserve the prefix: Express mounts the same routes at /mynotes.
        proxy_pass http://127.0.0.1:8026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mdpreview_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
