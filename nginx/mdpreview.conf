server {
    listen 80;
    server_name mdpreview.azmirf.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mdpreview.azmirf.my.id;

    # SSL certs (adjust paths to your actual cert locations)
    ssl_certificate /etc/letsencrypt/live/azmirf.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azmirf.my.id/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
